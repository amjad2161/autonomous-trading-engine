server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every route serves index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively; never cache the service worker / index.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
